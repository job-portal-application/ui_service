server {
    listen 3005;

    root /usr/share/nginx/html;
    index index.html;

    # UI service
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Auth service
    location /api/v1/auth/ {
        proxy_pass http://auth-service-alb-1213493423.ap-south-1.elb.amazonaws.com;
        proxy_set_header Host auth-service-alb-1213493423.ap-south-1.elb.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User service
    location /api/v1/users/ {
        proxy_pass http://user-service.job-portal-dev:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Job service
    location /api/v1/jobs/ {
        proxy_pass http://job-service.job-portal-dev:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI service
    location /api/v1/ai/ { 
        proxy_pass http://ai-service.job-portal-dev:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        return 200 'OK';
    }
}